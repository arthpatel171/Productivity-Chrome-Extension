
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Workspace</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b1020;
    font-family: Arial, sans-serif;
}

/* Main container */
.container {
    text-align: center;
}

/* Animated Offline Workspace text */
.offline-workspace {
    font-size: 42px;
    font-weight: bold;

    background: linear-gradient(
        90deg,
        #06b6d4,
        #6366f1,
        #06b6d4
    );

    background-size: 200% auto;
    background-position: 0% center;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: gradientMove 3s linear infinite;
}

/* Gradient animation */
@keyframes gradientMove {
    from {
        background-position: 0% center;
    }

    to {
        background-position: 200% center;
    }
}

/* Navigation bar */
nav {
    display: flex;
    align-items: center;
    position: relative;
    gap: 5px;
    padding: 7px;
    margin-top: 30px;

    background: #151c30;
    border: 1px solid #28334c;
    border-radius: 16px;
}

/* Navigation links */
nav a {
    position: relative;
    z-index: 2;
    padding: 14px 28px;

    color: #9ca3af;
    text-decoration: none;
    font-size: 14px;

    transition: color 0.3s;
}

nav a.active {
    color: white;
}

/* Sliding liquid indicator */
.indicator {
    position: absolute;
    height: 43px;
    border-radius: 11px;

    background: linear-gradient(
        90deg,
        #06b6d4,
        #6366f1
    );

    z-index: 1;
    pointer-events: none;

    transition:
        left 0.5s cubic-bezier(.68,-0.2,.27,1.3),
        width 0.5s cubic-bezier(.68,-0.2,.27,1.3);
}

/* Responsive design */
@media (max-width: 450px) {
    .offline-workspace {
        font-size: 30px;
    }

    nav a {
        padding: 12px 17px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="offline-workspace">
        Offline Workspace
    </h1>

    <nav>
        <span class="indicator"></span>

        <a href="#" class="active"
           onclick="changeTab(event,this)">Home</a>

        <a href="#"
           onclick="changeTab(event,this)">Projects</a>

        <a href="#"
           onclick="changeTab(event,this)">About</a>
    </nav>

</div>

<script>
const nav = document.querySelector("nav");
const indicator = document.querySelector(".indicator");

function updateIndicator(link) {
    indicator.style.width = link.offsetWidth + "px";
    indicator.style.left = link.offsetLeft + "px";
}

function changeTab(event, link) {
    event.preventDefault();

    nav.querySelectorAll("a").forEach(a => {
        a.classList.remove("active");
    });

    link.classList.add("active");

    updateIndicator(link);
}

// Set initial indicator position
updateIndicator(document.querySelector(".active"));

// Keep indicator aligned when window resizes
window.addEventListener("resize", () => {
    updateIndicator(document.querySelector(".active"));
});
</script>

</body>
</html>
