
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flip Theme Switch</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
    transition: background 0.4s, color 0.4s;
}

body.dark-mode {
    background: #0b1020;
    color: white;
}

/* Switch */
.theme-switch {
    width: 62px;
    height: 62px;
    border: none;
    border-radius: 14px;
    background: #fde68a;
    font-size: 28px;
    cursor: pointer;
    transition:
        transform 0.6s,
        background 0.4s,
        box-shadow 0.4s;
    transform-style: preserve-3d;
}

.theme-switch:hover {
    box-shadow: 0 5px 18px rgba(0,0,0,0.15);
}

.theme-switch:active {
    transform: scale(0.9);
}

/* Dark mode */
body.dark-mode .theme-switch {
    background: #312e81;
    transform: rotateY(180deg);
    box-shadow: 0 0 18px rgba(99,102,241,0.25);
}
</style>
</head>

<body>

<button class="theme-switch" id="themeSwitch"
        onclick="toggleTheme()" aria-label="Switch to dark mode">
    ☀️
</button>

<script>
function toggleTheme() {
    const isDark = document.body.classList.toggle("dark-mode");

    const button = document.getElementById("themeSwitch");

    button.textContent = isDark ? "🌙" : "☀️";

    button.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
    );
}
</script>

</body>
</html>
