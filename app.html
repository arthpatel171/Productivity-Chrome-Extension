<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline Workspace</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="todo-app-page">
  <main id="todo-extension-app">
    <header class="app-header">
      <div>
        <p class="eyebrow">Boost Productivity</p>
        <h1 class="offline-workspace">Offline Workspace</h1>
      </div>
      <div class="header-actions header-tools">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
        <details class="import-export"><summary>Import/Export</summary><div class="header-actions">
        <button id="export-all" type="button">Export backup</button><label class="file-button">Import backup<input id="import-all" type="file" accept="application/json"></label>
        <button id="export-notes" type="button">Export notes</button><label class="file-button">Import notes<input id="import-notes" type="file" accept="application/json"></label>
        <button id="export-tasks" type="button">Export schedules</button><label class="file-button">Import schedules<input id="import-tasks" type="file" accept="application/json"></label>
        <button id="export-settings" type="button">Export settings</button><label class="file-button">Import settings<input id="import-settings" type="file" accept="application/json"></label>
        <button id="export-timers" type="button">Export timers</button><label class="file-button">Import timers<input id="import-timers" type="file" accept="application/json"></label>
        </div></details>
      </div>
    </header>

    <nav class="tabs" aria-label="Workspace sections">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab is-active" type="button" data-view="calendar-view">Calendar</button>
      <button class="tab" type="button" data-view="notes-view">Notes</button>
      <button class="tab" type="button" data-view="time-view">Time tools</button>
    </nav>

    <section id="calendar-view" class="view is-visible">
      <div class="section-heading">
        <div><p class="eyebrow">Plan the day</p><h2>Calendar and tasks</h2></div>
        <button id="new-task" class="primary" type="button">+ New task</button>
      </div>
      <form id="task-form" class="task-form" hidden>
        <div class="form-grid">
          <label>Title<input name="title" required placeholder="Name of task"></label>
          <label>Color<div class="task-color-picker"><input name="color" type="color" value="#2f6fae" aria-label="Custom task color"><div class="standard-colors" aria-label="Standard task colors"></div><button class="custom-color-button" type="button">Choose custom color</button></div></label>
          <label>Description<textarea name="description" rows="2" placeholder="Optional details"></textarea></label>
          <fieldset class="task-time-range"><legend>Task time</legend><label>Start time<div class="time-input"><input name="startTime" type="text" inputmode="numeric" placeholder="5:47" pattern="[0-9]{1,2}:[0-9]{2}" required><select name="startPeriod" aria-label="Start time AM or PM"><option>AM</option><option>PM</option></select></div></label><label>End time<div class="time-input"><input name="endTime" type="text" inputmode="numeric" placeholder="6:47" pattern="[0-9]{1,2}:[0-9]{2}"><select name="endPeriod" aria-label="End time AM or PM"><option>AM</option><option>PM</option></select></div></label></fieldset>
        </div>
        <p id="task-meta" class="task-meta" aria-live="polite"></p>
        <div class="form-actions"><button type="submit" class="primary">Save task</button><button id="cancel-task" type="button">Cancel</button></div>
      </form>
      <div id="day-calendar" class="day-calendar" aria-label="Today's calendar"></div>
      <section id="task-color-chart" class="task-color-chart" aria-label="Task time by color"></section>
    </section>

    <section id="notes-view" class="view">
      <div class="section-heading">
        <div><p class="eyebrow">Write freely</p><h2>Notes</h2></div>
      </div>
      <div class="notes-layout">
        <aside class="note-sidebar" aria-label="Notes"><h2>My Notes</h2><button id="new-note" class="add-note-button" type="button" aria-label="Add new note">+ New Note</button><div id="note-list" class="note-list"></div></aside>
        <section id="note-editor-panel" class="note-editor-panel" aria-live="polite"></section>
      </div>
    </section>

    <section id="time-view" class="view">
      <div class="section-heading"><div><p class="eyebrow">Keep momentum</p><h2>Time tools</h2></div></div>
      <div class="tool-grid">
        <section class="tool-panel"><h3>Stopwatch</h3><output id="stopwatch-display">00:00:00</output><div class="button-row"><button id="stopwatch-toggle" class="primary" type="button">Start</button><button id="stopwatch-reset" type="button">Reset</button><button id="lap-button" type="button">Lap</button></div><div id="lap-list" class="lap-list"></div></section>
        <section class="tool-panel"><h3>Countdown</h3><div class="countdown-inputs"><label>Hours<input id="countdown-hours" type="number" min="0" step="1" value="0"></label><label>Minutes<input id="countdown-minutes" type="number" min="0" step="1" value="0"></label><label>Seconds<input id="countdown-seconds" type="number" min="0" max="59" step="1" value="0"></label></div><output id="countdown-display">00:00:00</output><div class="button-row"><button id="countdown-start" class="primary" type="button">Start</button><button id="countdown-reset" type="button">Reset</button></div></section>
      </div>
    </section>

    <p id="app-status" class="status" role="status"></p>
  </main>
  <script src="app.js?v=2.0.2"></script>
</body>
</html>
